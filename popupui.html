<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Zoom Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
            margin: 0;
            padding: 16px;
            width: 320px;
        }
        
        /* Navigation Header */
        .header { display: flex; align-items: center; font-size: 16px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 12px; }
        .back-btn { display: none; cursor: pointer; color: #3b82f6; margin-right: 8px; font-weight: bold; font-size: 18px; padding: 0 4px; user-select: none; }
        .back-btn:hover { color: #60a5fa; }
        
        /* View State Management */
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: translateY(0); } }

        /* Home View Specifics */
        .info-box { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .info-text { font-size: 13px; margin: 4px 0; color: #aaa; }
        .info-text span { color: #fff; font-weight: 500; }
        
        /* Title Clamping */
        .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; border-bottom: 1px solid #3a3a3a; padding-bottom: 8px; }
        .manga-title { flex: 1; font-size: 14px; font-weight: 600; color: #fff; margin: 0; word-break: break-word; line-height: 1.4; }
        .manga-title.clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .chevron { background: none; border: none; color: #888; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; height: 20px; width: 20px; }
        .chevron:hover { color: #fff; }
        .chevron::after { content: ''; display: block; width: 6px; height: 6px; border-bottom: 2px solid currentColor; border-right: 2px solid currentColor; transform: rotate(45deg); transition: transform 0.2s; }
        .chevron.expanded::after { transform: rotate(-135deg) translate(-2px, -2px); }

        /* Menu Cards */
        .menu-card { background: #222; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
        .menu-card:hover { background: #2a2a2a; border-color: #444; }
        .menu-card-left { display: flex; flex-direction: column; }
        .menu-title { font-weight: 600; color: #fff; font-size: 14px; margin-bottom: 4px; }
        .menu-preview { color: #888; font-size: 12px; }
        .menu-arrow { color: #666; font-weight: bold; font-size: 16px; }

        /* Form Elements */
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #ddd; }
        select, input[type="checkbox"] { background: #333; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px; width: 100%; box-sizing: border-box; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .checkbox-label input { width: auto; }
        
        button.action-btn { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        button.action-btn:hover { filter: brightness(1.1); }
        button.action-btn:disabled { background: #444 !important; color: #888; cursor: not-allowed; }
        
        textarea.dd-report { width: 100%; height: 120px; background: #111; color: #10b981; font-family: monospace; font-size: 11px; padding: 8px; border: 1px solid #333; border-radius: 6px; resize: none; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="header">
        <span class="back-btn" id="back-btn" title="Return Home">&lt;</span>
        <span id="header-title">Home</span>
    </div>
    
    <!-- HOME VIEW -->
    <div id="view-home" class="view active">
        <div class="info-box">
            <div class="title-row">
                <div id="manga-title" class="manga-title clamped">Loading...</div>
                <button id="title-chevron" class="chevron" title="Expand Title"></button>
            </div>
            <p class="info-text" id="image-count">Images Found: <span>0</span></p>
        </div>

        <div class="menu-card" id="nav-settings">
            <div class="menu-card-left">
                <span class="menu-title">Settings</span>
                <span class="menu-preview" id="settings-preview">Manga • 5% Pad • Adj On</span>
            </div>
            <span class="menu-arrow">&gt;</span>
        </div>

        <div class="menu-card" id="nav-debug">
            <div class="menu-card-left">
                <span class="menu-title">Debug & Telemetry</span>
                <span class="menu-preview" id="debug-preview">Status: Disabled</span>
            </div>
            <span class="menu-arrow">&gt;</span>
        </div>

        <button id="start-btn" class="action-btn" disabled>Launch Panel View</button>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="view-settings" class="view">
        <div class="control-group">
            <label for="reading-direction">Reading Direction</label>
            <select id="reading-direction">
                <option value="manga" selected>Manga (Right-to-Left)</option>
                <option value="comic">Comic (Left-to-Right)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="padding">Panel Padding</label>
            <select id="padding">
                <option value="0">None (0%)</option>
                <option value="2">Tight (2%)</option>
                <option value="5" selected>Normal (5%)</option>
                <option value="10">Loose (10%)</option>
            </select>
        </div>
        <div class="control-group" style="margin-top: 16px;">
            <label class="checkbox-label">
                <input type="checkbox" id="show-adjacent" checked>
                Show Adjacent Panels
            </label>
        </div>
    </div>

    <!-- DEBUG VIEW -->
    <div id="view-debug" class="view">
        <div class="control-group" style="margin-bottom: 16px;">
            <label class="checkbox-label" style="background: #2a2a2a; padding: 12px; border-radius: 6px; border: 1px solid #444;">
                <input type="checkbox" id="debug-mode">
                <strong style="color: #fff;">Enable Debug Mode</strong>
            </label>
        </div>
        <div id="debug-content" style="display: none;">
            <label style="color: #ef4444; font-weight: bold; font-size: 12px; margin-bottom: 4px; display: block;">Debug Dump (DD)</label>
            <textarea id="debug-dump" class="dd-report" readonly></textarea>
            <button id="copy-debug" class="action-btn" style="background: #4b5563; margin-top: 8px;">Copy DD Report</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
