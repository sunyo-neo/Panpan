<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PanPan Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Background System */
            --bg-base: #09090b;
            --bg-surface: rgba(24, 24, 27, 0.65);
            --bg-elevated: rgba(39, 39, 42, 0.8);
            --bg-glass-overlay: rgba(0, 0, 0, 0.4);
            
            /* Brand Colors */
            --primary-solid: #6366f1;
            --primary-gradient-start: #8b5cf6;
            --primary-gradient-end: #3b82f6;
            --primary-gradient: linear-gradient(135deg, var(--primary-gradient-start), var(--primary-gradient-end));
            
            /* Semantic Colors */
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-error: #ef4444;
            
            /* Typography Scale */
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            
            --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-size-micro: 0.625rem;  /* 10px */
            --font-size-sm: 0.75rem;      /* 12px */
            --font-size-base: 0.875rem;   /* 14px */
            --font-size-lg: 1rem;         /* 16px */
            
            /* Spacing System */
            --space-1: 0.25rem;   /* 4px */
            --space-2: 0.5rem;    /* 8px */
            --space-3: 0.75rem;   /* 12px */
            --space-4: 1rem;      /* 16px */
            --space-6: 1.5rem;    /* 24px */
            
            /* Border Radius */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-pill: 9999px;
            
            /* Effects */
            --shadow-ambient: 0 4px 20px rgba(0, 0, 0, 0.4);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --transition-fast: 0.2s ease-out;
            --transition-normal: 0.3s ease-out;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: var(--space-4);
            width: 320px;
            box-sizing: border-box;
        }
        
        /* Navigation Header */
        .header {
            display: flex;
            align-items: center;
            font-size: var(--font-size-lg);
            font-weight: 600;
            border-bottom: var(--glass-border);
            padding-bottom: var(--space-2);
            margin-bottom: var(--space-3);
        }
        .back-btn {
            display: none;
            cursor: pointer;
            margin-right: var(--space-2);
            padding: var(--space-1);
            border-radius: var(--radius-sm);
            transition: background var(--transition-fast);
            line-height: 0;
        }
        .back-btn:hover {
            background: var(--bg-elevated);
        }
        .back-btn svg {
            width: 16px;
            height: 16px;
            fill: var(--primary-solid);
        }
        
        /* View State Management */
        .view-container {
            position: relative;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: auto;
            overflow: hidden;
            width: 100%;
        }
        .view {
            grid-area: 1 / 1;
            display: none;
            width: 100%;
            box-sizing: border-box;
        }
        .view.active {
            display: block;
        }
        .view.anim-enter {
            display: block;
            animation: slideIn 0.25s forwards;
        }
        .view.anim-exit {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            animation: slideOut 0.25s forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(-15px); }
        }

        /* Home View Specifics */
        .info-box {
            background: var(--bg-surface);
            border: var(--glass-border);
            backdrop-filter: blur(12px);
            padding: var(--space-3);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-3);
            box-shadow: var(--shadow-ambient);
        }
        .info-text {
            font-size: var(--font-size-sm);
            margin: var(--space-1) 0;
            color: var(--text-secondary);
        }
        .info-text span {
            color: var(--text-primary);
            font-weight: 500;
        }
        
        /* Title Clamping */
        .title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: var(--space-2);
            margin-bottom: var(--space-2);
            border-bottom: var(--glass-border);
            padding-bottom: var(--space-2);
        }
        .manga-title {
            flex: 1;
            font-size: var(--font-size-base);
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            word-break: break-word;
            line-height: 1.4;
        }
        .manga-title.clamped {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .chevron {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: var(--space-1);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 20px;
            width: 20px;
            transition: color var(--transition-fast);
        }
        .chevron:hover {
            color: var(--text-primary);
        }
        .chevron::after {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            border-bottom: 2px solid currentColor;
            border-right: 2px solid currentColor;
            transform: rotate(45deg);
            transition: transform var(--transition-fast);
        }
        .chevron.expanded::after {
            transform: rotate(-135deg) translate(-2px, -2px);
        }

        /* Menu Cards */
        .menu-card {
            background: var(--bg-surface);
            border: var(--glass-border);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-md);
            padding: var(--space-3);
            margin-bottom: var(--space-2);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
            box-shadow: var(--shadow-ambient);
        }
        .menu-card:hover,
        .menu-card:focus-visible {
            background: var(--bg-elevated);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .menu-card:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--primary-solid);
        }
        .menu-card-left {
            display: flex;
            flex-direction: column;
        }
        .menu-title {
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--font-size-base);
            margin-bottom: var(--space-1);
        }
        .menu-preview {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }
        .menu-arrow {
            color: var(--text-secondary);
            font-weight: bold;
            font-size: var(--font-size-lg);
            transition: color var(--transition-fast);
        }
        .menu-card:hover .menu-arrow {
            color: var(--text-primary);
        }

        /* Form Elements */
        .control-group {
            margin-bottom: var(--space-3);
        }
        label {
            display: block;
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-2);
            color: var(--text-secondary);
        }
        select {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: var(--glass-border);
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-sm);
            width: 100%;
            box-sizing: border-box;
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            outline: none;
            transition: border-color var(--transition-fast), background var(--transition-fast);
        }
        select:focus {
            border-color: var(--primary-solid);
            background: var(--bg-elevated);
        }
        
        /* Custom Switch Toggles */
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .setting-label {
            font-size: var(--font-size-base);
            color: var(--text-secondary);
        }
        .toggle-switch {
            width: 44px;
            height: 24px;
            background-color: var(--text-muted);
            border-radius: var(--radius-pill);
            position: relative;
            cursor: pointer;
            transition: background-color var(--transition-fast);
            outline: none;
        }
        .toggle-switch:focus-visible {
            box-shadow: 0 0 0 2px var(--primary-solid);
        }
        .toggle-switch[aria-checked="true"] {
            background-color: var(--primary-solid);
        }
        .toggle-thumb {
            width: 18px;
            height: 18px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform var(--transition-fast);
        }
        .toggle-switch[aria-checked="true"] .toggle-thumb {
            transform: translateX(20px);
        }
        
        button.action-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: var(--text-primary);
            border: none;
            padding: var(--space-3);
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), opacity var(--transition-fast), background var(--transition-fast);
            margin-top: var(--space-2);
            font-family: var(--font-family);
            font-size: var(--font-size-base);
        }
        button.action-btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }
        button.action-btn:active:not(:disabled) {
            transform: translateY(1px);
        }
        button.action-btn:disabled {
            background: var(--bg-elevated) !important;
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        button.action-btn:not(:disabled) {
            box-shadow: 0 4px 14px 0 rgba(139, 92, 246, 0.4);
            animation: pulse-shadow 2s infinite;
        }
        @keyframes pulse-shadow {
            0% {
                box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.6);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(139, 92, 246, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(139, 92, 246, 0);
            }
        }
        
        textarea.dd-report {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.4);
            color: var(--color-success);
            font-family: monospace;
            font-size: 11px;
            padding: var(--space-2);
            border: var(--glass-border);
            border-radius: var(--radius-sm);
            resize: none;
            box-sizing: border-box;
        }

        /* Accordion Styling */
        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-3) 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: var(--space-4);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: var(--font-size-base);
            font-weight: 500;
            transition: color var(--transition-fast);
            outline: none;
        }
        .accordion-header:hover, .accordion-header:focus-visible {
            color: var(--text-primary);
        }
        .accordion-header .chevron {
            width: 16px;
            height: 16px;
            transition: transform var(--transition-normal);
            color: var(--text-secondary);
        }
        .accordion-header:hover .chevron, .accordion-header:focus-visible .chevron {
            color: var(--text-primary);
        }
        .accordion-header .chevron.expanded {
            transform: rotate(180deg);
        }
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.33, 1, 0.68, 1);
            overflow: hidden;
            will-change: grid-template-rows;
        }
        .accordion-content.expanded {
            grid-template-rows: 1fr;
        }
        .accordion-inner {
            min-height: 0;
            overflow: hidden;
            padding-top: var(--space-4);
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="back-btn" id="back-btn" aria-label="Back" role="button" tabindex="0">
            <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; display: block;">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
            </svg>
        </span>
        <span id="header-title">Home</span>
    </div>
    
    <div class="view-container">
        <!-- HOME VIEW -->
        <div id="view-home" class="view active">
            <div class="info-box">
                <div class="title-row">
                    <div id="manga-title" class="manga-title clamped">Loading...</div>
                    <button id="title-chevron" class="chevron" title="Expand Title"></button>
                </div>
                <p class="info-text" id="image-count">Images Found: <span>0</span></p>
            </div>

            <div class="menu-card" id="nav-settings" role="button" tabindex="0">
                <div class="menu-card-left">
                    <span class="menu-title">Settings</span>
                    <span class="menu-preview" id="settings-preview">Manga • 5% Pad • Adj On</span>
                </div>
                <span class="menu-arrow">&gt;</span>
            </div>

            <button id="start-btn" class="action-btn" disabled>Launch Panel View</button>
        </div>

        <!-- SETTINGS VIEW -->
        <div id="view-settings" class="view">
            <div class="control-group">
                <label for="reading-direction">Reading Direction</label>
                <select id="reading-direction">
                    <option value="manga" selected>Manga (Right-to-Left)</option>
                    <option value="comic">Comic (Left-to-Right)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="padding">Panel Padding</label>
                <select id="padding">
                    <option value="0">None (0%)</option>
                    <option value="2">Tight (2%)</option>
                    <option value="5" selected>Normal (5%)</option>
                    <option value="10">Loose (10%)</option>
                </select>
            </div>
            <div class="control-group" style="margin-top: 16px;">
                <div class="setting-row">
                    <span class="setting-label">Show Adjacent Panels</span>
                    <div class="toggle-switch" id="show-adjacent" tabindex="0" role="checkbox" aria-checked="true">
                        <div class="toggle-thumb"></div>
                    </div>
                </div>
            </div>
            
            <div class="control-group" style="margin-top: 16px;">
                <div class="setting-row">
                    <div style="display: flex; flex-direction: column;">
                        <span class="setting-label" style="font-weight: 500;">Hybrid Mode</span>
                        <span style="color: var(--text-muted); font-size: var(--font-size-sm); margin-top: 2px;">See full page before panels</span>
                    </div>
                    <div class="toggle-switch" id="hybrid-mode-toggle" tabindex="0" role="checkbox" aria-checked="false">
                        <div class="toggle-thumb"></div>
                    </div>
                </div>
            </div>
            
            <div class="accordion-header" id="adv-settings-toggle" role="button" tabindex="0">
                <span>Advanced Settings</span>
                <svg class="chevron" id="adv-chevron" viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor; display: block;">
                    <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                </svg>
            </div>
            <div class="accordion-content" id="adv-settings-content">
                <div class="accordion-inner">
                    <div class="control-group">
                        <div class="setting-row" style="background: var(--bg-surface); padding: 12px; border-radius: var(--radius-md); border: var(--glass-border);">
                            <div class="setting-label-block">
                                <strong style="color: var(--text-primary); font-size: var(--font-size-base);">Enable Debug Mode</strong>
                            </div>
                            <div class="toggle-switch" id="debug-mode" tabindex="0" role="checkbox" aria-checked="false">
                                <div class="toggle-thumb"></div>
                            </div>
                        </div>
                    </div>
                    <div id="debug-content" style="display: none; margin-top: 12px;">
                        <label style="color: var(--color-error); font-weight: bold; font-size: 12px; margin-bottom: 4px; display: block;">Debug Dump (DD)</label>
                        <textarea id="debug-dump" class="dd-report" readonly></textarea>
                        <button id="copy-debug" class="action-btn" style="background: #4b5563; margin-top: 8px;">Copy DD Report</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
